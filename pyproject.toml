[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xinfer-forge"
version = "1.0.0"
description = "Autonomous On-Device Model Adaptation & Continuous Learning Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "Kamran Saberifard", email = "kamran@blackbox-sentinel.io" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "numpy>=1.23.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "scikit-learn>=1.2.0",
]

[project.scripts]
forge-cli = "forge.cli:main"