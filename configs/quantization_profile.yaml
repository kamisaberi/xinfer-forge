# Automated Post-Training Quantization (PTQ) Configuration
# Path: xinfer-forge/configs/quantization_profile.yaml

quantization:
  engine: "ONNX_RUNTIME"          # ONNX_RUNTIME, OPENVINO_NNCF, TENSORRT
  precision: "INT8"               # INT8, FP16
  quant_format: "QOPERAND"        # QOPERAND (Scale & Zero-Point)
  calibration:
    num_samples: 500
    dataset_path: "var/lib/sentinel-nexus/forge_datasets/calibration.slab"
  safety_gate:
    min_recall_threshold: 0.990     # Set to 0.990 (99.0%) for quantized models
    max_false_positive_rate: 0.005